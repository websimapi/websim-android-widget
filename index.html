<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Android Widget</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="phone-screen">
        <div id="widget">
            <div id="time">10:09</div>
            <div id="date">Tuesday, October 26</div>
            <div id="weather">
                <div class="location">San Francisco</div>
                <div class="condition">
                    <img src="weather_icon.png" alt="sunny icon">
                    <span>25°C</span>
                </div>
            </div>
        </div>

        <div id="app-dock">
            <img src="icon_phone.png" alt="phone icon" class="dock-icon">
            <img src="icon_messages.png" alt="messages icon" class="dock-icon">
            <img src="icon_browser.png" alt="browser icon" class="dock-icon">
            <img src="icon_camera.png" alt="camera icon" class="dock-icon">
        </div>
    </div>

    <div id="info-box">
        <p><strong>This is a web simulation of an Android widget.</strong></p>
        <p>To add it to your phone's home screen, tap your browser's menu (usually ⋮ or ⚫⚫⚫) and select "Add to Home Screen" or "Install App".</p>
    </div>

    <script src="script.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
